company:
  name: New Akkurt AI Company
  mode: local
  default_execution: dry_run
  timezone: Europe/Istanbul

governance:
  require_human_approval_for: [publish, deploy, spend, delete, network_device_change]
  allow_shell_execution: false
  allow_autonomous_external_writes: false

orchestration:
  max_parallel_agents: 3
  max_retries_per_task: 2
  task_timeout_seconds: 900
  require_qa_before_completion: true
