name: Continuous AI Agent Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-company-agent-worker
  cancel-in-progress: false

jobs:
  consume-analysis-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Check worker secrets without printing values
        id: credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_GATE_KEY: ${{ secrets.SUPABASE_DB_GATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = (
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "SUPABASE_DB_GATE_KEY",
              "GEMINI_API_KEY",
          )
          missing = [key for key in required if not os.getenv(key)]
          ready = not missing
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={'true' if ready else 'false'}\n")
          if missing:
              print("Agent worker paused. Add these repository Actions secrets: " + ", ".join(missing))
          else:
              print("Agent worker credentials: present (values hidden)")
          PY

      - name: Process one queued analysis task
        if: steps.credentials.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_GATE_KEY: ${{ secrets.SUPABASE_DB_GATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m company.worker --once

      - name: Report idle or waiting state
        if: steps.credentials.outputs.ready != 'true'
        run: echo "Worker is safely paused until repository secrets are configured."
