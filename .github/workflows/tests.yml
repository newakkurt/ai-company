name: Python tests

on:
  push:
    branches: [main, "feature/**", "factory/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run company unit tests
        run: python -m unittest discover -s tests -v
      - name: Run NetCmd offline audit tool tests
        working-directory: products/netcmd-ai-network-copilot/tools
        run: python -m unittest discover -s . -p "test_*.py" -v
