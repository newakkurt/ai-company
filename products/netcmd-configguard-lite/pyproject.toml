[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcmd-configguard-lite"
version = "1.0.0"
description = "Offline read-only multi-vendor network configuration baseline auditor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
netcmd-configguard = "netcmd_configguard.audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
